# Test the Python scripts bundled with the `tools/ai-tools` Claude Code plugin
# (published as `simsci-research` in vivarium-suite's marketplace.json).
#
# The scripts use only the standard library, so pytest is the only install.

name: Test AI Tools

on:
  pull_request:
    paths: ['tools/ai-tools/**', '.github/workflows/test-ai-tools.yml']
  push:
    branches: [main]
    paths: ['tools/ai-tools/**', '.github/workflows/test-ai-tools.yml']

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Oldest and newest Python the scripts support.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tools/ai-tools/tests -v
